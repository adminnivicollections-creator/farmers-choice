name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fc
          POSTGRES_PASSWORD: fc
          POSTGRES_DB: farmers_choice_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U fc" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://fc:fc@localhost:5433/farmers_choice_test
      JWT_SECRET: ci-secret
      OTP_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm -w @fc/api run prisma:generate
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/api
      - run: npm -w @fc/api run test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/mobile
