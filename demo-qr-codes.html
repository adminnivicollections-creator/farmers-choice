<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo QR Codes</title>
<style>
  :root { --bg:#faf9f7; --fg:#1a1a1a; --muted:#6b6b6b; --card:#fff; --line:#e5e3df; --warn:#b42318; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#17181a; --fg:#ececec; --muted:#9a9a9a; --card:#202124; --line:#303234; --warn:#ff6b5e; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:center; }
  .qr { width:200px; height:200px; margin:0 auto 14px; background:#fff; padding:10px; border-radius:8px; }
  .qr canvas, .qr img { display:block; width:100%; height:100%; }
  .name { font-weight:600; margin-bottom:4px; }
  .expect { font-size:.85rem; color:var(--muted); }
  .expect.warn { color:var(--warn); font-weight:600; }
  code { font-size:.75rem; color:var(--muted); word-break:break-all; }
</style></head>
<body><div class="wrap">
<h1>Farmer's Choice — demo QR codes</h1>
<p class="sub">Scan these from this screen with the app. Each one exercises a different path.</p>
<div class="grid" id="grid"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CODES = [
  { raw:'FC1:DEMOseedMTU1010batchA',  name:'Paddy Seeds (MTU 1010)', expect:'Genuine — shows batch detail' },
  { raw:'FC1:DEMOneemOilGreenGrow01', name:'Organic Neem Oil',       expect:'Genuine — shows batch detail' },
  { raw:'FC1:DEMOrecalledBatchXYZ99', name:'Recalled batch',         expect:'RECALL WARNING — do not use', warn:true },
  { raw:'FC1:DEMOtractorMahindra575', name:'Tractor (Mahindra 575)', expect:'Genuine — equipment record' },
  { raw:'FC1:NOSUCHCODEHERE000001',   name:'Unknown code',           expect:'Not recognised' },
  { raw:'upi://pay?pa=scam@ybl',      name:'Someone else’s QR (UPI)', expect:'Refused, and never opened', warn:true },
];
const grid = document.getElementById('grid');
for (const c of CODES) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="qr"></div><div class="name">${c.name}</div>
    <div class="expect ${c.warn ? 'warn' : ''}">${c.expect}</div><code>${c.raw}</code>`;
  grid.appendChild(el);
  new QRCode(el.querySelector('.qr'), { text: c.raw, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
}
</script></body></html>
